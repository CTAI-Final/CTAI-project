[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctai-project"
version = "0.1.0"
description = "Multi-vehicle delivery routing benchmark for the CTAI course project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["vehicle-routing", "vrptw", "metaheuristics", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ctai = "ctai.cli:main"

[project.urls]
Documentation = "https://github.com/CTAI-Final/CTAI-project/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctai = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
