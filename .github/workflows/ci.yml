name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          python -m ctai check data/practice/easy_01.json
          python -m ctai demo --time-limit 1

      - name: Fixed-work reference run
        run: |
          python -m ctai run data/practice \
            -a greedy_insertion local_search \
            --seeds 1 --mode fixed_work --work-budget 5000 \
            --out results/ci
